<!--
  ============================================================================
  MORY SALON — OFFERS COMPONENT (offers-component.html)
  ============================================================================
  This file is NOT a standalone page. It is fetched at runtime by index.html
  (see the #offersMount loader script in index.html) and injected into the
  page, so it relies on the CSS variables and fonts already defined by
  index.html's :root (--gold, --panel, --text, --font-ui, --font-brand, etc.)
  to automatically match the site's identity. Opening this file directly in
  a browser will show unstyled/incomplete content — that's expected.

  HOW TO ADD / EDIT / REMOVE OFFERS
  ----------------------------------
  Scroll down to the "OFFERS DATA" block inside the <script> below and edit
  the OFFERS array. You never need to touch index.html for this.

  Each offer object supports:
    id           (string, required)  unique id
    type         "poster" | "card"   required
                   - "poster": a ready-made promotional image fills the card
                   - "card":   a text card in the site's beige/brown style
    title        (string, required)  offer name — also the text placed into
                                      the "الخدمة" field on the booking form
    image        (string, optional)  image URL — required for "poster",
                                      optional small thumbnail for "card"
    description  (string, optional)  short text — shown on "card" type only
    price        (number, optional)  shown with the riyal icon if present
    badge        (string, optional)  small ribbon/label, e.g. "عرض الأسبوع"
    ctaLabel     (string, optional)  defaults to "احجز العرض"

  Example:
    { id:"o1", type:"card", title:"عرض الجمعة", description:"حلاقة شعر ودقن + هدية",
      price:45, badge:"عرض محدود", ctaLabel:"احجز العرض" }
    { id:"o2", type:"poster", title:"عرض الافتتاح", image:"https://.../poster.jpg" }

  If OFFERS is empty, this component renders nothing and stays invisible —
  the section simply does not exist on the page until offers are added.
  ============================================================================
-->
<style>
  #offersSection{ padding:6px 22px 34px; max-width:600px; margin:0 auto; }
  #offersSection .section-head{ margin-bottom:20px; }
  #offersSection .section-head .eyebrow{
    display:block; font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:var(--gold-2); margin-bottom:6px; font-weight:600; font-family:var(--font-ui);
  }
  #offersSection .section-head h2{
    font-size:24px; font-family:var(--font-ui); font-weight:700; color:var(--text); margin:0;
  }
  #offersSection .drag-hint{
    font-size:11.5px; color:var(--text-faint); margin-top:10px; text-align:center; font-family:var(--font-ui);
  }

  .offers-track{
    display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x proximity;
    padding:2px 2px 10px; margin:0 -2px;
    -ms-overflow-style:none; scrollbar-width:none; cursor:grab;
  }
  .offers-track::-webkit-scrollbar{ display:none; }
  .offers-track.dragging{ cursor:grabbing; scroll-snap-type:none; }

  .offer-slide{
    flex:0 0 78%; max-width:320px; scroll-snap-align:start;
    border:1px solid var(--line); border-radius:var(--radius-lg);
    background:var(--panel); overflow:hidden; position:relative;
    box-shadow:0 8px 22px rgba(74,53,37,.1);
  }

  /* ---- Card type ---- */
  .offer-inner{ padding:20px; display:flex; flex-direction:column; gap:10px; }
  .offer-card-img{ border-radius:var(--radius-sm); overflow:hidden; margin-bottom:2px; }
  .offer-card-img img{ width:100%; height:140px; object-fit:cover; display:block; }
  .offer-title{
    font-family:var(--font-ui); font-weight:700; font-size:17px; color:var(--text); margin:0;
  }
  .offer-desc{ font-family:var(--font-ui); font-size:12.5px; color:var(--text-dim); line-height:1.7; margin:0; }
  .offer-price{
    font-family:var(--font-ui); font-weight:700; font-size:19px; color:var(--gold);
    display:flex; align-items:center;
  }
  .offer-price .riyal-ic{ height:1em; width:auto; display:inline-block; vertical-align:middle; margin-inline-end:4px; }

  /* ---- Poster type ---- */
  .offer-poster{ display:flex; flex-direction:column; height:100%; }
  .offer-poster-img{ width:100%; height:200px; object-fit:cover; display:block; }
  .offer-poster-foot{
    padding:16px 18px; display:flex; flex-direction:column; gap:10px;
    background:var(--panel);
  }
  .offer-poster-foot .offer-title{ font-size:16px; }

  /* ---- Shared badge + CTA ---- */
  .offer-badge{
    position:absolute; top:12px; inset-inline-start:12px; z-index:2;
    background:linear-gradient(120deg, var(--gold-deep), var(--gold) 60%, #E8C99A);
    color:var(--on-gold); font-family:var(--font-ui); font-size:10.5px; font-weight:800;
    letter-spacing:.5px; padding:4px 11px; border-radius:999px;
    box-shadow:0 4px 10px rgba(169,113,66,.3);
  }
  .offer-cta{
    margin-top:4px; width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(120deg, var(--gold-deep) 0%, var(--gold) 55%, #E8C99A 100%);
    color:var(--on-gold); font-family:var(--font-ui); font-weight:700; font-size:13.5px;
    border:none; border-radius:var(--radius-md); padding:12px 16px; cursor:pointer;
    box-shadow:0 8px 18px rgba(169,113,66,.28);
  }
  .offer-cta:active{ transform:scale(.97); }
  .offer-cta .arrow{ font-size:14px; }
</style>

<section id="offersSection" style="display:none;">
  <div class="section-head">
    <span class="eyebrow">Exclusive</span>
    <h2>عروض موري الحصرية</h2>
  </div>
  <div class="offers-track" id="offersTrack"></div>
  <p class="drag-hint">اسحب لتصفح جميع العروض</p>
</section>

<script>
(function(){

  /* ============================================================
     OFFERS DATA — عدّل هنا فقط لإضافة أو حذف أو تعديل أي عرض
     ============================================================ */
  var OFFERS = [
    // فارغ حالياً بالتصميم — أضف عروضك بنفس الصيغة الموضحة أعلى الملف.
  ];
  /* ============================================================ */

  if(!OFFERS || !OFFERS.length) return; // لا عروض = القسم يبقى مخفياً بالكامل

  var section = document.getElementById('offersSection');
  var track = document.getElementById('offersTrack');
  if(!section || !track) return;
  section.style.display = '';

  function riyalIcon(){
    return '<svg class="riyal-ic" viewBox="0 0 1124.14 1256.39" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">' +
      '<path d="M699.62,1113.02h0c-20.06,44.48-33.32,92.75-38.4,143.37l424.51-90.24c20.06-44.47,33.31-92.75,38.4-143.37l-424.51,90.24Z"/>' +
      '<path d="M1085.73,895.8c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.33v-135.2l292.27-62.11c20.06-44.47,33.32-92.75,38.4-143.37l-330.68,70.27V66.13c-50.67,28.45-95.67,66.32-132.25,110.99v403.35l-132.25,28.11V0c-50.67,28.44-95.67,66.32-132.25,110.99v525.69l-295.91,62.88c-20.06,44.47-33.33,92.75-38.42,143.37l334.33-71.05v170.26l-358.3,76.14c-20.06,44.47-33.32,92.75-38.4,143.37l375.04-79.7c30.53-6.35,56.77-24.4,73.83-49.24l68.78-101.97v-.02c7.14-10.55,11.3-23.27,11.3-36.97v-149.98l132.25-28.11v270.4l424.53-90.28Z"/>' +
      '</svg>';
  }

  function cardHtml(o){
    var badge = o.badge ? '<span class="offer-badge">' + o.badge + '</span>' : '';
    var img = o.image ? '<div class="offer-card-img"><img src="' + o.image + '" alt="' + (o.title || '') + '"></div>' : '';
    var desc = o.description ? '<p class="offer-desc">' + o.description + '</p>' : '';
    var price = (typeof o.price !== 'undefined' && o.price !== null)
      ? '<div class="offer-price">' + o.price + riyalIcon() + '</div>' : '';
    return badge +
      '<div class="offer-inner">' + img +
        '<h3 class="offer-title">' + (o.title || '') + '</h3>' +
        desc + price +
        '<button type="button" class="offer-cta" data-offer="' + o.id + '">' +
          (o.ctaLabel || 'احجز العرض') + ' <span class="arrow">←</span>' +
        '</button>' +
      '</div>';
  }

  function posterHtml(o){
    var badge = o.badge ? '<span class="offer-badge">' + o.badge + '</span>' : '';
    return badge +
      '<div class="offer-poster">' +
        '<img class="offer-poster-img" src="' + (o.image || '') + '" alt="' + (o.title || 'عرض') + '">' +
        '<div class="offer-poster-foot">' +
          (o.title ? '<h3 class="offer-title">' + o.title + '</h3>' : '') +
          '<button type="button" class="offer-cta" data-offer="' + o.id + '">' +
            (o.ctaLabel || 'احجز العرض') + ' <span class="arrow">←</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  OFFERS.forEach(function(o){
    var slide = document.createElement('div');
    slide.className = 'offer-slide';
    slide.innerHTML = (o.type === 'poster') ? posterHtml(o) : cardHtml(o);
    track.appendChild(slide);
  });

  /* ---- CTA: fill "الخدمة" with the offer title + smooth scroll to booking ---- */
  track.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.offer-cta') : null;
    if(!btn) return;
    var offer = OFFERS.filter(function(o){ return o.id === btn.getAttribute('data-offer'); })[0];
    if(!offer) return;
    if(window.MoryBooking){
      window.MoryBooking.selectService(offer.title);
      window.MoryBooking.scrollToBooking();
    }
  });

  /* ---- Optional pointer-drag scrolling for mouse users (touch works natively) ---- */
  var isDown = false, startX = 0, startScroll = 0;
  track.addEventListener('pointerdown', function(e){
    isDown = true;
    track.classList.add('dragging');
    startX = e.clientX;
    startScroll = track.scrollLeft;
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', function(e){
    if(!isDown) return;
    track.scrollLeft = startScroll - (e.clientX - startX);
  });
  function endDrag(){ isDown = false; track.classList.remove('dragging'); }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

})();
</script>
